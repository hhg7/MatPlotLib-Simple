name             = Matplotlib-Simple
author           = David E. Condon <dec986@gmail.com>
license          = Perl_5
copyright_year   = 2025-present
copyright_holder = David E. Condon

[@Filter]
-bundle = @Basic
-remove = GatherDir
-remove = MakeMaker

[Git::GatherDir]
exclude_filename = Makefile.PL

[MakeMaker]
eumm_version = 6.58

; A whitelist, not a blacklist: anything not named here is pruned from the
; tarball.  SECURITY.md has to be listed or the file is in git, visible on
; GitHub, and absent from the distribution -- which is the one place CPANSec's
; policy and the CPANTS "has_security_doc" metric look for it.  It is written
; by security.policy.pl, which stays out of the tarball like every other .pl.
[PruneFiles]
match = ^(?!lib/|t/|pod/|README(\.md)?$|CONTRIBUTING\.md$|SECURITY\.md$|Changes$|Makefile\.PL$|META\.(yml|json)$|LICENSE$|MANIFEST$).

[VersionFromModule]
[MetaJSON]

; CPANTS "meta_yml_has_provides": META.yml and META.json must name the modules
; the distribution installs, so that a tool can tell what indexing this tarball
; claims without unpacking and scanning it.  @Basic's MetaYAML/MetaJSON only
; write the metadata other plugins hand them, and nothing here was handing them
; a "provides", so both files shipped without one.  This scans the gathered .pm
; files and adds it -- one entry, Matplotlib::Simple, since lib/ holds one
; module.
[MetaProvides::Package]

[Prereqs]
perl                = 5.010
autodie             = 0
Capture::Tiny       = 0
Data::Printer       = 0
Devel::Confess      = 0
Devel::Size         = 0
IPC::System::Simple = 0
JSON::MaybeXS       = 0
MIME::Base64        = 0
Scalar::Util        = 1.22
Test::Exception     = 0
Test::More          = 0

[MetaResources]
repository.web = https://github.com/hhg7/MatPlotLib-Simple
repository.url = git://github.com/hhg7/MatPlotLib-Simple
repository.type = git
bugtracker.web = https://github.com/hhg7/MatPlotLib-Simple/issues
homepage = https://metacpan.org/dist/Matplotlib-Simple
