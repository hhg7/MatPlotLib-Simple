name             = Stats-LikeR
author           = David E. Condon <dec986@gmail.com>
license          = Perl_5
copyright_year   = 2026-present
copyright_holder = David E. Condon

[@Filter]
-bundle = @Basic
-remove = GatherDir
-remove = MakeMaker

[Git::GatherDir]
exclude_filename = Makefile.PL

[MakeMaker]
eumm_version = 6.58

[PruneFiles]
match = ^(?!lib/|t/|pod/|README(\.md)?$|Changes$|Makefile\.PL$|META\.(yml|json)$|LICENSE$|MANIFEST$).

[VersionFromModule]
[MetaJSON]

[Prereqs]
perl                = 5.010
autodie             = 0
Cwd                 = 0
Devel::Confess      = 0
Scalar::Util        = 1.22
Test::Exception     = 0
Test::LeakTrace     = 0
Test::More          = 0

[MetaResources]
repository.web = https://github.com/hhg7/stats
repository.url = https://github.com/hhg7/stats.git
repository.type = git
bugtracker.web = https://github.com/hhg7/stats/issues
homepage = https://metacpan.org/dist/stats
