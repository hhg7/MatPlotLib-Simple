name             = Matplotlib-Simple
author           = David E. Condon <dec986@gmail.com>
license          = Perl_5
copyright_year   = 2025-present
copyright_holder = David E. Condon

[@Filter]
-bundle = @Basic
-remove = GatherDir
-remove = MakeMaker

[Git::GatherDir]
exclude_filename = Makefile.PL

[MakeMaker]
eumm_version = 6.58

[PruneFiles]
match = ^(?!lib/|t/|pod/|README(\.md)?$|CONTRIBUTING\.md$|Changes$|Makefile\.PL$|META\.(yml|json)$|LICENSE$|MANIFEST$).

[VersionFromModule]
[MetaJSON]

[Prereqs]
perl                = 5.010
autodie             = 0
Capture::Tiny       = 0
Data::Printer       = 0
Devel::Confess      = 0
Devel::Size         = 0
IPC::System::Simple = 0
JSON::MaybeXS       = 0
MIME::Base64        = 0
Scalar::Util        = 1.22
Test::Exception     = 0
Test::More          = 0

[MetaResources]
repository.web = https://github.com/hhg7/MatPlotLib-Simple
repository.url = git://github.com/hhg7/MatPlotLib-Simple
repository.type = git
bugtracker.web = https://github.com/hhg7/MatPlotLib-Simple/issues
homepage = https://metacpan.org/dist/Matplotlib-Simple
